plugins {
    id 'com.android.application'
}

android {
    namespace 'com.allroadbike.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.allroadbike.app'
        minSdk 23
        targetSdk 36
        versionCode 130
        versionName '1.30'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
