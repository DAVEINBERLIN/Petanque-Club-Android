plugins {
    id 'com.android.application'
}

android {
    namespace 'com.allroadbike.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.allroadbike.app'
        minSdk 26
        targetSdk 36
        versionCode 131
        versionName '1.31'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
}
